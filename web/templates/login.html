<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Bowling Tracker - Access</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="logo-area">
            <span class="icon">🎳</span>
            <h2>Bowling Tracker</h2>
            <p>Private Biomechanics & Video Analytics</p>
        </div>
        
        {% if error %}
        <div class="alert alert-error">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="login-form">
            <div class="form-group">
                <label for="passcode">Enter Access Passcode</label>
                <input type="password" id="passcode" name="passcode" placeholder="••••••••" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Unlock Dashboard</button>
        </form>

        <div class="login-footer">
            <small>🔒 Protected Private Instance</small>
        </div>
    </div>
</body>
</html>
