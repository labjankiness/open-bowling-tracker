name: live_bowling_tracker
description: Two-handed bowling biomechanics + live game scoring app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  bowling_core:
    path: ../packages/bowling_core
  biomechanics_core:
    path: ../packages/biomechanics_core
  camera: ^0.11.0
  google_mlkit_pose_detection: ^0.13.0
  google_mlkit_commons: ^0.9.0
  # Phase 4: pin detection -- likely a custom TFLite model via tflite_flutter,
  # once real pin-deck footage has been used to train it.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
